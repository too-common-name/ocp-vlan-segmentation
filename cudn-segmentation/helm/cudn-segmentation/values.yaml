physicalInterface: eno1

nodeSelector:
  node-role.kubernetes.io/worker: ""

vlans:
  - id: 100
    subnet: "10.100.0.0/24"
  - id: 200
    subnet: "10.200.0.0/24"

ovsBridge:
  name: br-secondary
  bridgeMapping:
    localnet: localnet-br-secondary

# CUDN namespaceSelector matches on: <namespaceLabel>: "vlan<id>"
namespaceLabel: vlan-network

test:
  enabled: true
  image: registry.k8s.io/e2e-test-images/agnhost:2.39

cleanup: false
