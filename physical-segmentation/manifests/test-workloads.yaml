---
apiVersion: v1
kind: Namespace
metadata:
  name: test-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: test-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/e2e-test-images/agnhost:2.39
        args: ["netexec", "--http-port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: test-echo
  annotations:
    metallb.universe.tf/address-pool: vlan-seg-pool-vlan100
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: echo
  ports:
  - port: 80
    targetPort: 8080
