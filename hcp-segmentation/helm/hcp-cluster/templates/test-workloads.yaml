{{- if .Values.test.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: test-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: test-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: {{ .Values.test.image }}
        args: ["netexec", "--http-port", "{{ .Values.test.port }}"]
        ports:
        - containerPort: {{ .Values.test.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: test-echo
  annotations:
    metallb.universe.tf/address-pool: vlan-seg-pool-vlan{{ .Values.vlanId }}
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
  - port: 80
    targetPort: {{ .Values.test.port }}
{{- end }}
