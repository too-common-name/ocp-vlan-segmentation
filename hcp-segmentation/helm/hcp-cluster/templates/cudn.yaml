apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: localnet-vlan{{ .Values.vlanId }}
spec:
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - clusters-{{ .Values.clusterName }}
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: {{ .Values.localnet }}
      ipam:
        mode: Disabled
      vlan:
        mode: Access
        access:
          id: {{ .Values.vlanId }}
