{{- if not .Values.cleanup }}
{{- range .Values.vlans }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ $.Release.Name }}-l2adv-vlan{{ .id }}
  namespace: {{ $.Values.metallb.namespace }}
  labels:
    {{- include "vlan-seg.labels" $ | nindent 4 }}
spec:
  ipAddressPools:
  - {{ $.Release.Name }}-pool-vlan{{ .id }}
  interfaces:
  - {{ include "vlan-seg.ifname" (dict "vlanId" .id) }}
{{- end }}
{{- end }}
