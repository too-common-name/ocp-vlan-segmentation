# ovs-bridge | vlan-subinterfaces
bridgeType: ovs-bridge

physicalInterface: eno1

nodeSelector:
  node-role.kubernetes.io/worker: ""

vlans:
  - id: 100
    subnet: "10.100.0.0/24"
    poolStart: "10.100.0.200"
    poolEnd: "10.100.0.210"
  - id: 200
    subnet: "10.200.0.0/24"
    poolStart: "10.200.0.200"
    poolEnd: "10.200.0.210"

nodes:
  - name: overseer-1
    vlans:
      - id: 100
        ip: "10.100.0.10"
        prefixLength: 24
      - id: 200
        ip: "10.200.0.10"
        prefixLength: 24
  - name: overseer-2
    vlans:
      - id: 100
        ip: "10.100.0.11"
        prefixLength: 24
      - id: 200
        ip: "10.200.0.11"
        prefixLength: 24
  - name: overseer-3
    vlans:
      - id: 100
        ip: "10.100.0.12"
        prefixLength: 24
      - id: 200
        ip: "10.200.0.12"
        prefixLength: 24

# Only used when bridgeType=ovs-bridge
ovsBridge:
  name: br-secondary
  bridgeMapping:
    enabled: true
    localnet: localnet-br-secondary

metallb:
  namespace: metallb-system

test:
  enabled: true

# nftables pre-filter — blocks cross-VLAN VIP access before OVN-K's DNAT
vlanIsolation:
  enabled: true
  # worker or master (for compact clusters)
  role: worker

cleanup: false
