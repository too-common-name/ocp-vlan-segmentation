apiVersion: v2
name: vlan-segmentation
description: >-
  Network segmentation for industrial workloads on OpenShift.
  Supports two approaches: OVS bridge (with bridge-mapping for HCP/KubeVirt)
  and VLAN subinterfaces (lightweight, MetalLB-only).
  IP forwarding is managed natively via NMState (ipv4.forwarding: true).
version: 0.1.0
appVersion: "1.0"
kubeVersion: ">= 1.27.0"
dependencies: []
# Requirements:
#   - kubernetes-nmstate operator (nmstate >= 2.2)
#   - MetalLB operator
