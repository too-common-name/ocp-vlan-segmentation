apiVersion: v2
name: vlan-segmentation
description: >-
  Network segmentation for industrial workloads on OpenShift.
  Supports three bridge types: OVS bridge, VLAN subinterfaces, Linux bridge.
  IP forwarding is managed natively via NMState (ipv4.forwarding: true).
version: 0.1.0
appVersion: "1.0"
kubeVersion: ">= 1.27.0"
dependencies: []
