{{/*
  Cluster-wide NNCP for OVS bridge creation / teardown.
  Only rendered for ovs-bridge (not vlan-subinterfaces).
  When cleanup=true, sets state: absent to remove the bridge cleanly.
*/}}
{{- if eq .Values.bridgeType "ovs-bridge" }}
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: {{ .Release.Name }}-bridge
  labels:
    {{- include "vlan-seg.labels" . | nindent 4 }}
spec:
  nodeSelector:
    {{- toYaml .Values.nodeSelector | nindent 4 }}
  desiredState:
    interfaces:
    - name: {{ .Values.ovsBridge.name }}
      type: ovs-bridge
      {{- if .Values.cleanup }}
      state: absent
      {{- else }}
      state: up
      bridge:
        allow-extra-patch-ports: true
        options:
          stp:
            enabled: false
        port:
        - name: {{ .Values.physicalInterface }}
        {{- range .Values.vlans }}
        - name: vlan{{ .id }}
          vlan:
            mode: access
            tag: {{ .id }}
        {{- end }}
      {{- end }}
    {{- if and (not .Values.cleanup) .Values.ovsBridge.bridgeMapping.enabled }}
    ovn:
      bridge-mappings:
      - bridge: {{ .Values.ovsBridge.name }}
        localnet: {{ .Values.ovsBridge.bridgeMapping.localnet }}
        state: present
    {{- end }}
{{- end }}
